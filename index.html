
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmarShield - Site officiel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: #020812;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #111111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
            border: 1px solid #173c60;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            color: #8e8e8e;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #007acc;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #005999;
        }

        /* Animation de rotation du bouclier */
        @keyframes tournerBouclier {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .logo-bouclier {
            width: 100px;
            height: 120px;
            margin: 0 auto 15px;
            display: grid;
            place-items: center;
            font-size: 50px;
            font-weight: bold;
            color: white;
            background: linear-gradient(130deg, #ff4a57, #e90020 50%, #70000e);
            clip-path: polygon(50% 0, 95% 16%, 88% 65%, 50% 100%, 12% 65%, 5% 16%);
            filter: drop-shadow(0 0 22px #ff001e);
            animation: tournerBouclier 3s linear infinite;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="logo-bouclier">O</div>

        <h1>OmarShield</h1>
        <p>Official Site - Security & Signatures</p>

        <a href="https://pascalomarr.github.io/omarshield-signatures-site/" class="btn">Accéder aux signatures</a>

    </div>

</body>
</html>
